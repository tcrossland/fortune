# Excess reportable income (ERI) for accumulating UK reporting funds —
# copy to data/eri.toml and edit. The real file is gitignored (personal
# holdings data); the funds publish these figures (not on Pictet's
# advices).
#
# One [[eri]] per fund reporting period. Per-unit figures are in the
# fund's `currency`; tax-report multiplies by the units you held at the
# fund's reporting period end, converts to GBP at
# `fund_distribution_date`, taxes (gross - equalisation) as income, and
# adds that net to the section 104 base cost. `income_type` is
# `dividend` (equity funds) or `interest` (bond/credit funds, >60%
# interest-bearing).
#
# `fund_distribution_date` is the deemed-income date — the UK tax point,
# six months after the fund's reporting period end, and what fund and
# custodian tax reports display. The reportable holding is measured at
# the period end six months earlier, which tax-report derives
# automatically. Only set `period_end` to override that derivation for a
# fund whose period-to-distribution gap isn't the regulatory six months.

[[eri]]
isin = "LU0767911984"
fund_distribution_date = 2024-12-31  # deemed-income date (period end + 6 months)
income_type = "interest"             # interest | dividend
eri_per_unit = 0.4521                # excess reportable income per unit
equalisation_per_unit = 0.0          # per unit, for units bought in-period
currency = "EUR"
# period_end = 2024-06-30            # optional; derived as the month end
                                     # six months before the distribution date
