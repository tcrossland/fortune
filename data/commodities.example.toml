# UK-tax commodity metadata — copy to data/commodities.toml and edit.
#
# data/commodities.toml is gitignored (it's personal holdings data),
# mirroring the banking-pipeline.toml / banking-pipeline.example.toml
# split. The `portfolio` and `rebuild` commands read it and emit a
# beancount `commodity` directive per held ISIN so disposals can be
# partitioned for SA108 (CGT) vs SA106 (offshore income gains) at
# tax-report time.
#
# One [[commodity]] table per security. Run
#   banking-pipeline portfolio <data_dir> --list-missing-metadata
# to list in-use ISINs that still need an entry here.

[[commodity]]
isin = "IE00B3VWN518"
name = "iShares Core MSCI World UCITS ETF"
domicile = "IE"
reporting_status = "reporting"   # reporting | non-reporting | uk-domestic | unknown
asset_class = "equity-etf"       # equity-etf | bond | equity-fund | money-market | other
first_acquired = 2018-03-15
# deeply_discounted = true       # optional: a deeply discounted security
                                 # (gain taxed as income, not CGT)
# distributions_as_interest = true  # optional: a >60%-interest-bearing
                                 # offshore fund ("bond fund" rule) — its
                                 # distributions/ERI are foreign interest,
                                 # not dividends (SA106 interest box)
# uk_situs = false               # optional: override UK-situs for the
                                 # 4-year FIG regime (whether a gain is
                                 # relievable under a FIG claim). Omitted
                                 # → derived: UK iff GB-domiciled or
                                 # reporting_status = "uk-domestic"
# issuer = "iShares"             # optional: fund house / manager for the
                                 # concentration report's "by issuer"
                                 # (single-provider) exposure. Omitted →
                                 # inferred from `name`; set it only when
                                 # the name can't be placed automatically
