[project]
name = "banking-pipeline"
version = "0.1.0"
description = "Ingest banking PDFs, classify, extract fields, emit beancount entries."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    # --- PDF text extraction ---
    # pypdfium2: Apache-2.0 / BSD-3-Clause (Google's PDFium bindings).
    # Used instead of PyMuPDF because PyMuPDF is AGPL-3.0.
    "pypdfium2>=4.30.0",
    # pdfplumber: MIT. Layout-aware text + table extraction, built on pdfminer.six.
    "pdfplumber>=0.11.4",
    # --- Structured models / validation ---
    # pydantic: MIT. Runtime-validated models for documents, transactions, postings.
    "pydantic>=2.9",
    # pydantic-settings: MIT. 12-factor config from env vars / .env / TOML.
    "pydantic-settings>=2.6",
    # --- Field parsing ---
    # dateparser: BSD-3-Clause. Multi-locale date parsing ("23 avril 2026", "23/04/26", etc.).
    "dateparser>=1.2",
    # python-stdnum: LGPL-2.1-or-later. Validates/normalises ISIN, IBAN, BIC, VAT numbers.
    # LGPL is permissive for dynamic linking as done here.
    "python-stdnum>=1.20",
    # Babel: BSD-3-Clause. Locale-aware number/currency parsing.
    "babel>=2.16",
    # --- LLM fallback (classification + extraction) ---
    # anthropic: MIT. Official SDK for Claude. Used for the LLM fallback branches.
    "anthropic>=0.39",
    # --- CLI + output ---
    # typer: MIT. Click-based CLI with type hints.
    "typer>=0.13",
    # rich: MIT. Pretty logs, tables, tracebacks in the CLI.
    "rich>=13.9",
    # --- Logging ---
    # structlog: Apache-2.0 / MIT dual. Structured JSON/console logs.
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    # beancount: GPL-2.0. Dev/test only — provides the ``bean-check``
    # binary the pipeline shells out to, and the loader the goldens parse.
    # The shipped package never imports it (see CLAUDE.md / bean_check.py).
    "beancount>=3.2.2",
    # pytest: MIT. Test runner.
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # ruff: MIT. Linter + formatter.
    "ruff>=0.8",
    # mypy: MIT. Static type checker.
    "mypy>=1.13",
]

[project.optional-dependencies]
# OCR for scanned PDFs. Tesseract binary must be installed separately (Apache-2.0).
ocr = [
    # pytesseract: Apache-2.0. Python wrapper around the Tesseract OCR binary.
    "pytesseract>=0.3.13",
    # ocrmypdf: MPL-2.0. Adds a searchable text layer to scanned PDFs.
    "ocrmypdf>=16.6",
]

[project.scripts]
banking-pipeline = "banking_pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
# ``.claude`` holds tooling state (agent worktrees etc.), not project
# source — keep it out of lint runs.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Inline Revolut CSV record fixtures are single-line strings that read
# far better unbroken than wrapped or concatenated mid-record.
"tests/test_revolut_csv.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

# Third-party libraries without bundled type information / py.typed.
# Treat their imports as untyped rather than failing the strict run.
[[tool.mypy.overrides]]
module = ["dateparser.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
